<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Louvor IRN</title>
</head>

<body style="
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f7ff;
  font-family:Arial,sans-serif;
">

  <div style="
    width:90%;
    max-width:420px;
    box-sizing:border-box;
    background:#ffffff;
    padding:32px 24px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
  ">

    <div style="font-size:54px;">🎵</div>

    <h1 style="
      font-size:24px;
      margin:10px 0;
      color:#172033;
    ">
      Ministério de Louvor IRN
    </h1>

    <p style="
      color:#555;
      line-height:1.5;
      margin-bottom:25px;
    ">
      Você recebeu um convite para participar do Louvor IRN.
    </p>

    <a
      href="intent://join#Intent;scheme=louvorirn;package=br.com.igreja.irn.louvor;end"
      style="
        display:block;
        padding:16px;
        background:#2463e6;
        color:#ffffff;
        text-decoration:none;
        border-radius:14px;
        font-size:17px;
        font-weight:bold;
      "
    >
      Abrir Louvor IRN
    </a>

    <p style="
      margin-top:18px;
      font-size:13px;
      color:#777;
    ">
      Toque no botão acima para abrir o aplicativo.
    </p>

  </div>

</body>
</html>
